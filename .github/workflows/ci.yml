name: CI

# Автопроверка при пуше и в pull request: типы + unit-тесты + сборка.
# E2E (Playwright) не гоняем в CI — тяжёлые, остаются локальным гейтом.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build
